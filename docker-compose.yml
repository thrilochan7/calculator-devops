services:
  calculator:
    image: ${DOCKER_IMAGE:-calculator-devops}:${IMAGE_TAG:-latest}
    container_name: calculator
    environment:
      - PORT=8080
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - calc-net

  nginx:
    image: nginx:1.27-alpine
    container_name: calculator-nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - calc-net

networks:
  calc-net:
    driver: bridge
